name: VoiceMatrix
options:
  bundleIdPrefix: com.voicematrix
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: ee78635d23d52379117554ba72358b65a0612447
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    revision: a57702e6f523fa36ac5532d2bdc5f35f701a052c
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: 1,2
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: 0.4.9
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGNING_ALLOWED: false
targets:
  VoiceMatrix:
    type: application
    platform: iOS
    sources:
    - path: VoiceMatrix
      excludes:
      - Resources
    - path: Assets.xcassets
    - path: VoiceMatrix/Resources/Phonon
      type: folder
      buildPhase: resources
    - path: VoiceMatrix/Resources/OpenVoice
      type: folder
      buildPhase: resources
    - path: VoiceMatrix/Resources/ParakeetASR
      type: folder
      buildPhase: resources
    - path: VoiceMatrix/Resources/ParakeetNotices
      type: folder
      buildPhase: resources
    - path: VoiceMatrix/Resources/Diarization
      type: folder
      buildPhase: resources
    - path: VoiceMatrix/Resources/F5TTS
      type: folder
      buildPhase: resources
    dependencies:
    - package: FluidAudio
    - package: SpeechSwift
      product: F5TTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: VoiceMatrix
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio privately on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIFileSharingEnabled: false
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
  VoiceMatrixTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - VoiceMatrixTests
    - path: tests/fixtures/conversion-reference.wav
      buildPhase: resources
    dependencies:
    - target: VoiceMatrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.tests
  VoiceMatrixUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - VoiceMatrixUITests
    dependencies:
    - target: VoiceMatrix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.uitests
  CharacterRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - CharacterRuntimeTests
    - path: tests/fixtures/conversion-source.wav
      buildPhase: resources
    - path: tests/fixtures/conversion-reference.wav
      buildPhase: resources
    - path: tests/fixtures/DiagnosticVoices
      type: folder
      buildPhase: resources
    dependencies:
    - target: CharacterRuntimeHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.character-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CharacterRuntimeHost.app/CharacterRuntimeHost
        BUNDLE_LOADER: $(TEST_HOST)
  CharacterSpeechDiagnostic:
    type: tool
    platform: macOS
    sources:
    - path: probes/native-f5/Calibration.swift
    - path: VoiceMatrix/F5ReferenceEngine.swift
    - path: VoiceMatrix/F5SpeechChunks.swift
    - path: VoiceMatrix/CharacterFolderStore.swift
    dependencies:
    - package: SpeechSwift
      product: F5TTS
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: '15.0'
  CharacterRuntimeHost:
    type: application
    platform: iOS
    sources:
    - path: probes/native-conversion/RuntimeHost.swift
    - path: VoiceMatrix/CharacterFolderStore.swift
    - path: VoiceMatrix/Catalog.swift
    - path: VoiceMatrix/ConversionAudio.swift
    - path: VoiceMatrix/OfflineVoiceConverter.swift
    - path: VoiceMatrix/CharacterVoiceConversion.swift
    - path: VoiceMatrix/Resources/OpenVoice
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.character-runtime-host
  BundledASRDiagnostic:
    type: tool
    platform: macOS
    sources:
    - path: probes/native-asr/Diagnostic.swift
    - path: VoiceMatrix/OnDeviceTranscription.swift
    - path: VoiceMatrix/BundledASRPolicy.swift
    - path: VoiceMatrix/BundledASRAssets.swift
    - path: VoiceMatrix/LocalStudioEvidence.swift
    dependencies:
    - package: FluidAudio
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: '15.0'
  LocalStudioDiagnostic:
    type: tool
    platform: macOS
    sources:
    - path: probes/native-local-studio/Diagnostic.swift
    - path: VoiceMatrix/LocalVideoStudio.swift
    - path: VoiceMatrix/LocalStudioJournal.swift
    - path: VoiceMatrix/LocalMediaAcquisition.swift
    - path: VoiceMatrix/LocalMediaURLPolicy.swift
    - path: VoiceMatrix/LocalVideoAudio.swift
    - path: VoiceMatrix/LocalSpeakerDiarization.swift
    - path: VoiceMatrix/LocalSpeakerPolicy.swift
    - path: VoiceMatrix/LocalSoundQuality.swift
    - path: VoiceMatrix/LocalSoundQualityPolicy.swift
    - path: VoiceMatrix/LocalStudioEvidence.swift
    - path: VoiceMatrix/OnDeviceTranscription.swift
    - path: VoiceMatrix/BundledASRAssets.swift
    - path: VoiceMatrix/BundledASRPolicy.swift
    - path: VoiceMatrix/F5ReferenceEngine.swift
    - path: VoiceMatrix/F5SpeechChunks.swift
    - path: VoiceMatrix/CharacterLibrary.swift
    - path: VoiceMatrix/CharacterFolderStore.swift
    - path: VoiceMatrix/CharacterReviewStore.swift
    - path: VoiceMatrix/CharacterVoiceConversion.swift
    - path: VoiceMatrix/RemoteVoiceCatalog.swift
    - path: VoiceMatrix/VoiceCatalogConnection.swift
    - path: VoiceMatrix/VoiceFolderSync.swift
    - path: VoiceMatrix/VoiceSyncLog.swift
    - path: VoiceMatrix/LaptopConnection.swift
    - path: VoiceMatrix/VideoWorkflow.swift
    - path: VoiceMatrix/VideoCandidateRequest.swift
    - path: VoiceMatrix/AudioStore.swift
    - path: VoiceMatrix/StudioActivity.swift
    - path: VoiceMatrix/SpeechEngine.swift
    - path: VoiceMatrix/Catalog.swift
    - path: VoiceMatrix/DeviceChecks.swift
    - path: VoiceMatrix/OfflineVoiceConverter.swift
    - path: VoiceMatrix/ConversionAudio.swift
    - path: VoiceMatrix/HybridAudio.swift
    - path: VoiceMatrix/TemporaryAudio.swift
    - path: VoiceMatrix/SpeechRendering.swift
    dependencies:
    - package: FluidAudio
    - package: SpeechSwift
      product: F5TTS
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: '15.0'
schemes:
  LocalStudioDiagnostic:
    build:
      targets:
        LocalStudioDiagnostic: all
  BundledASRDiagnostic:
    build:
      targets:
        BundledASRDiagnostic: all
  VoiceMatrix:
    build:
      targets:
        VoiceMatrix: all
        VoiceMatrixTests:
        - test
        VoiceMatrixUITests:
        - test
    test:
      targets:
      - VoiceMatrixTests
      - VoiceMatrixUITests
  CharacterRuntimeChecks:
    build:
      targets:
        CharacterRuntimeHost: all
        CharacterRuntimeTests:
        - test
    test:
      targets:
      - CharacterRuntimeTests
  CharacterSpeechDiagnostic:
    build:
      targets:
        CharacterSpeechDiagnostic: all
