name: GHOSTLINE
packages:
  piper-objc:
    url: https://github.com/R347H4CK3R/piper-objc.git
    branch: main
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.2
options:
  bundleIdPrefix: com.ghostline.studio
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.13.1'
    CURRENT_PROJECT_VERSION: '26'
    INFOPLIST_KEY_CFBundleShortVersionString: '0.13.1'
    INFOPLIST_KEY_CFBundleVersion: '26'
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
targets:
  GHOSTLINE:
    type: application
    platform: iOS
    dependencies:
      - package: piper-objc
        product: piper-player
      - package: FluidAudio
        product: FluidAudio
    info:
      path: Ghostline/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: Ghostline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostline.studio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: GHOSTLINE
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record your voice to play with audio effects.
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
