name: VoiceMatrix
options:
  bundleIdPrefix: com.voicematrix
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: ee78635d23d52379117554ba72358b65a0612447
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
    CODE_SIGNING_ALLOWED: NO
targets:
  VoiceMatrix:
    type: application
    platform: iOS
    sources:
      - path: VoiceMatrix
        excludes: [Resources]
      - path: Assets.xcassets
    resources:
      - path: VoiceMatrix/Resources/Phonon
        type: folder
    dependencies:
      - package: FluidAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicematrix.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: VoiceMatrix
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio privately on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
