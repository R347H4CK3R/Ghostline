name: GHOSTLINE
packages:
  piper-objc:
    url: https://github.com/piper-tts-apps/piper-objc.git
    exactVersion: 0.2.50
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.2
  swift-tts:
    url: https://github.com/arraypress/swift-tts.git
    from: 3.2.1
options:
  bundleIdPrefix: com.ghostline.studio
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
targets:
  GHOSTLINE:
    type: application
    platform: iOS
    dependencies:
      - package: piper-objc
        product: piper-player
      - package: swift-tts
        product: SpeechSynthesizer
      - package: swift-tts
        product: PocketTTS
      - package: FluidAudio
        product: FluidAudio
    sources:
      - path: Ghostline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ghostline.studio
        INFOPLIST_KEY_CFBundleDisplayName: GHOSTLINE
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record your voice to play with audio effects.
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
