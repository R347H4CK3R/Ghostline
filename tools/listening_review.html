<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceMatrix listening review</title><style nonce="__CSRF__">body{background:#10091c;color:#f4edff;font:18px system-ui;max-width:760px;margin:auto;padding:20px}audio,input,textarea,select,button{box-sizing:border-box;width:100%;max-width:100%;margin:8px 0;padding:10px}section{border:1px solid #9864c4;border-radius:12px;padding:16px;margin:20px 0}button{min-height:48px;background:#69309b;color:white;border:0;border-radius:10px}a{color:#dfb4ff}label{display:block}.status{white-space:pre-wrap}</style>
<h1>Listen and review</h1><p>Compare the reference and generated preview. Record your own listening judgment. A Matches decision does not activate a replacement, authorize a likeness, pass native/device checks or complete the video.</p><a href="review">Review source segments</a><button id="refresh">Refresh checked outputs</button><p id="status" role="status"></p><main id="candidates"></main>
<script nonce="__CSRF__">const csrf="__CSRF__";const $=id=>document.getElementById(id);
async function load(){try{const response=await fetch('listening/catalog',{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error);$('candidates').replaceChildren();$('status').textContent=data.candidates.length+' checked outputs awaiting review. '+data.errors.map(e=>e.videoID+': '+e.error).join(' ');for(const row of data.candidates){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=row.name;section.append(title);for(const kind of ['reference','preview']){const label=document.createElement('p'),audio=document.createElement('audio');label.textContent=kind==='reference'?'Reference conditioning audio':'Generated preview';audio.controls=true;audio.preload='none';audio.src='listening/assets/'+row.videoID+'/'+row.attempt+'/'+row.profileIndex+'/'+row.snapshot+'/'+kind;section.append(label,audio);}const info=document.createElement('p');info.textContent='Word check WER: '+row.wordErrorRate+'. Physical device verified: '+row.physicalDeviceVerified+'. Native profile verified: '+row.nativePerProfileVerified+'.';section.append(info);const form=document.createElement('form');form.innerHTML='<label>Your reviewer name<input name="reviewer" required maxlength="200"></label><label>Your listening decision<select name="decision" required><option value="">Choose after listening</option><option value="Matches">Matches</option><option value="DoesntMatch">Doesn’t match</option><option value="Unsure">Unsure</option></select></label><label>Notes<textarea name="note" maxlength="3000"></textarea></label><button>Save listening decision</button>';const history=document.createElement('p');history.textContent=row.reviews.map(r=>r.reviewer+': '+r.decision).join(' · ')||'No listening decisions yet.';const status=document.createElement('p');status.className='status';status.setAttribute('role','status');form.onsubmit=async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{const fields=new FormData(form),body={videoID:row.videoID,attempt:row.attempt,profileIndex:row.profileIndex,snapshot:row.snapshot,reviewer:fields.get('reviewer'),decision:fields.get('decision'),note:fields.get('note')};const r=await fetch('listening/decisions',{method:'POST',headers:{'Content-Type':'application/json','X-VoiceMatrix-Review':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent='Decision saved for these exact audio hashes. Active voices and queue completion remain unchanged.';history.textContent+=' · '+d.reviewer+': '+d.decision;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};section.append(history,form,status);$('candidates').append(section);}}catch(error){$('status').textContent=error.message;}}$('refresh').onclick=load;load();</script></html>
