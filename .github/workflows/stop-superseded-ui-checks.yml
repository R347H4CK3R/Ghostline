name: Verify published VoiceMatrix feeds
on:
  push:
    branches: [maintenance/stop-superseded-ui-checks]
    paths: [.github/workflows/stop-superseded-ui-checks.yml]
permissions:
  actions: write
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Finalize release wording and run the feed reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          repo="R347H4CK3R/Ghostline";tag="voicematrix-v0.4.4"
          release=json.loads(subprocess.check_output(["gh","api",f"repos/{repo}/releases/tags/{tag}"]))
          assert release["target_commitish"] == "b0a39f7525ca23b96d4f4f303abb732916485d5b"
          assert not release["draft"] and not release["prerelease"]
          body=release["body"].replace("Chris reported working audio in 0.4.3.","Working audio was reported in 0.4.3.")
          if body != release["body"]:
              pathlib.Path("release-notes.txt").write_text(body)
              subprocess.run(["gh","release","edit",tag,"--repo",repo,"--notes-file","release-notes.txt"],check=True)
          subprocess.run(["gh","api","--method","POST",f"repos/{repo}/actions/workflows/release-feed-sync.yml/dispatches","-f","ref=main"],check=True)
          print("Requested verified feed reconciliation for the published 0.4.4 release.")
          PY
