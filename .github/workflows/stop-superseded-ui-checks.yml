name: Stop superseded UI checks
on:
  push:
    branches: [maintenance/stop-superseded-ui-checks]
    paths: [.github/workflows/stop-superseded-ui-checks.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the superseded runs from this UI task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          repo="R347H4CK3R/Ghostline"
          expected={
            42517443357:("9d50fb1c87311a99e6ad3ad9904ad72a0b2f3f9d","release/voicematrix-0.4.4"),
            42517443391:("9d50fb1c87311a99e6ad3ad9904ad72a0b2f3f9d","release/voicematrix-0.4.4")}
          for run_id,(sha,branch) in expected.items():
              path=f"repos/{repo}/actions/runs/{run_id}"
              run=json.loads(subprocess.check_output(["gh","api",path]))
              assert (run["head_sha"],run["head_branch"]) == (sha,branch)
              if run["status"] == "completed":
                  print(run_id,run["conclusion"]);continue
              subprocess.run(["gh","api","--method","POST",path+"/cancel"],check=True)
              print(run_id,"cancellation requested")
          PY
