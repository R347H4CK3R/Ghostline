name: Native app compile checks
concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare source-only project resources
      run: |
        python3 tools/check_conversion_inputs.py
        python3 tools/create_diagnostic_collection.py
        mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS
        brew install xcodegen
        xcodegen generate
    - name: Compile full ARM64 app without IPA packaging
      run: |
        xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath native-build CODE_SIGNING_ALLOWED=NO build > native-compile.log 2>&1 || { tail -160 native-compile.log; exit 1; }
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Native-app-compile-log
        path: native-compile.log
        retention-days: 7
'on':
  push:
    paths:
    - '.github/workflows/voicematrix-049-candidate.yml'
    - VoiceMatrix/**
    - project.yml
    - .github/workflows/native-app.yml
  workflow_dispatch: null
