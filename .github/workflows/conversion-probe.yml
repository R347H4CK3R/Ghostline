name: VoiceMatrix native offline conversion probe
on:
  push:
    branches: ['probe/voicematrix-conversion-*']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Source checks
        run: python3 -m unittest discover -s tests -v
      - name: Bundle locally loaded inference assets
        run: |
          python3 tools/assets.py
          python3 tools/bundle_openvoice.py
      - run: brew install xcodegen
      - name: Run independent DSP and actual model tests
        env:
          NSUnbufferedIO: YES
        run: |
          xcodegen generate
          python3 - <<'PY'
          import sys,json,subprocess
          sys.path.insert(0,'tools')
          from run_native_tests import run
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          device=next(d['udid'] for group in devices['devices'].values() for d in group if 'iPhone' in d['name'])
          code=run(['xcodebuild','-project','VoiceMatrix.xcodeproj','-scheme','VoiceMatrix','-destination','platform=iOS Simulator,id='+device,'-derivedDataPath','conversion-tests','-parallel-testing-enabled','NO','-only-testing:VoiceMatrixTests/ConversionTests','CODE_SIGNING_ALLOWED=NO','test'],'conversion-tests.log',timeout=1500)
          sys.exit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VoiceMatrix-conversion-probe
          path: |
            conversion-tests.log
            conversion-tests/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 14
