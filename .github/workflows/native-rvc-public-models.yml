name: Actual public RVC frontend model parity
on:
  push:
    branches: ['work/native-rvc-public-model-parity', 'work/native-crepe-pitch']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-public-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU export toolchain
        run: |
          python -m pip install --no-deps torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch==2.6.0 torchaudio==2.6.0 transformers==4.49.0 onnx==1.17.0 onnxruntime==1.24.2 torchcrepe==0.0.24
      - run: python experiments/RVCModelParity/test_artifacts.py
      - run: python experiments/RVCModelParity/test_pitch.py
      - name: Native pitch boundary sanitizer checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/RVCModelParity/Runner/pitch.cpp experiments/RVCModelParity/Checks/pitch.cpp -o "$RUNNER_TEMP/pitch-check"
          "$RUNNER_TEMP/pitch-check"
      - name: Hash-pinned public model export and actual numerical parity
        run: |
          python experiments/RVCModelParity/export_models.py "$RUNNER_TEMP/public-models" "$GITHUB_SHA"
          python experiments/RVCModelParity/artifacts.py "$RUNNER_TEMP/public-models" "$GITHUB_SHA"
          python -m pip freeze > "$RUNNER_TEMP/public-models/toolchain.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Public-frontend-model-parity
          path: |
            ${{ runner.temp }}/public-models/*.onnx
            ${{ runner.temp }}/public-models/*.f32
            ${{ runner.temp }}/public-models/*.json
            ${{ runner.temp }}/public-models/*.txt
          retention-days: 7
          if-no-files-found: error
  apple-real-models:
    needs: export-public-models
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Public-frontend-model-parity
          path: public-models
      - name: Verify exact-source artifact hashes before native execution
        run: python3 experiments/RVCModelParity/artifacts.py public-models "$GITHUB_SHA"
      - name: Execute real exported public graphs through native Apple ORT
        working-directory: experiments/RVCModelParity
        run: swift run RVCModelParity "$GITHUB_WORKSPACE/public-models"
      - name: Compile native pitch frontend for iPhone ARM64
        run: xcrun --sdk iphoneos clang++ -std=c++17 -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -Wall -Wextra -Werror -c experiments/RVCModelParity/Runner/pitch.cpp -o "$RUNNER_TEMP/pitch.o"
