name: Current no-stock character UI smoke
on:
  push:
    branches-ignore: ['release/**']
    paths:
      - 'VoiceMatrix/App.swift'
      - 'VoiceMatrix/AudioStore.swift'
      - 'VoiceMatrix/AppUpdates.swift'
      - 'VoiceMatrixTests/AppUpdateTests.swift'
      - 'VoiceMatrixTests/PlaybackTests.swift'
      - 'VoiceMatrix/CharacterLibraryView.swift'
      - 'VoiceMatrix/LaptopConnection.swift'
      - 'VoiceMatrixUITests/CharacterEmptyStateUITests.swift'
      - 'VoiceMatrixUITests/CharacterWorkflowUITests.swift'
      - 'project.yml'
      - '.github/workflows/character-ui-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source-only UI resources, not a speech build
        run: |
          python3 tools/check_conversion_inputs.py
          python3 tools/create_diagnostic_collection.py
          mkdir -p VoiceMatrix/Resources/Phonon VoiceMatrix/Resources/OpenVoice VoiceMatrix/Resources/F5TTS
          # These are UI availability fixtures, not valid engines or speech assets.
          # No config, weights, stock profiles or private references enter the app.
          printf '{"testOnlyUIAvailability":true}\n' > VoiceMatrix/Resources/F5TTS/voicematrix-engine.json
          printf '{"testOnlyUIAvailability":true}\n' > VoiceMatrix/Resources/OpenVoice/model-manifest.json
          cp -R tests/fixtures/DiagnosticVoices VoiceMatrix/Resources/F5TTS/UITestVoices
          # XCTest waits for UI idleness after taps; a 2.5-second clip can finish
          # before it can inspect Stop. Extend only this UI fixture, not audio gates.
          python3 - <<'PY'
          import hashlib,json,pathlib,wave
          root=pathlib.Path('VoiceMatrix/Resources/F5TTS/UITestVoices/diagnostic-neutral')
          audio=root/'reference.wav'
          with wave.open(str(audio),'rb') as f:
              params=f.getparams()
              pcm=f.readframes(f.getnframes())*6
          with wave.open(str(audio),'wb') as f:
              f.setparams(params)
              f.writeframes(pcm)
          manifest=json.loads((root/'manifest.json').read_text())
          manifest.update(referenceSHA256=hashlib.sha256(audio.read_bytes()).hexdigest(),
                          referenceBytes=audio.stat().st_size,seconds=len(pcm)/48000,
                          referenceText=' '.join([manifest['referenceText']]*6))
          (root/'manifest.json').write_text(json.dumps(manifest))
          assert 14 < manifest['seconds'] < 15
          PY
          brew install xcodegen
          xcodegen generate
          xcrun simctl list devices available --json > ui-simulator.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('ui-simulator.json'))
          devices=[d for runtime,items in data['devices'].items() if 'iOS-26' in runtime for d in items if d['isAvailable'] and d['name'].startswith('iPhone')]
          assert devices,'No iOS 26 simulator available'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+devices[0]['udid']+'\n')
          PY
      - name: Build UI tests before starting the simulator
        run: |
          xcodebuild build-for-testing -only-testing:VoiceMatrixUITests/CharacterWorkflowUITests -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ui-build CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:VoiceMatrixUITests/CharacterEmptyStateUITests -only-testing:VoiceMatrixTests/PlaybackTests -only-testing:VoiceMatrixTests/AppUpdateTests > character-ui-build.log 2>&1 || { tail -160 character-ui-build.log; exit 1; }
      - name: Wait for the simulator launch services to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Exercise native playback and current SwiftUI empty-library flows
        run: |
          xcodebuild test-without-building -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ui-build -resultBundlePath character-ui.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:VoiceMatrixUITests/CharacterEmptyStateUITests -only-testing:VoiceMatrixTests/PlaybackTests -only-testing:VoiceMatrixTests/AppUpdateTests > character-ui.log 2>&1 || { tail -160 character-ui.log; exit 1; }
      - name: Import a synthetic voice, select, play reference and relaunch
        run: |
          xcodebuild test-without-building -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ui-build -resultBundlePath character-workflow.xcresult CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:VoiceMatrixUITests/CharacterWorkflowUITests > character-workflow.log 2>&1 || { tail -160 character-workflow.log; exit 1; }
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -d character-ui.xcresult ]; then xcrun xcresulttool export attachments --path character-ui.xcresult --output-path ui-screenshots; fi
          if [ -d character-workflow.xcresult ]; then xcrun xcresulttool export attachments --path character-workflow.xcresult --output-path workflow-screenshots; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Current-character-UI-evidence
          path: |
            character-workflow.log
            character-workflow.xcresult
            workflow-screenshots
            character-ui.log
            character-ui-build.log
            ui-simulator.json
            character-ui.xcresult
            ui-screenshots
          retention-days: 14
