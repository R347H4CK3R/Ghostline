name: Publish inspected unfinished VoiceMatrix build15 preview
'on':
  push:
    branches:
    - publish/voicematrix-build15-preview
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-voicematrix-build15-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'R347H4CK3R/Ghostline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require reviewed immutable publication pins
      run: python3 -c 'from tools.publish_preview15 import require_pins; require_pins()'
    - uses: actions/checkout@v4
      with:
        repository: R347H4CK3R/VoiceMatrix-Development
        ref: e5c239aaab933f855356d4a69bbcaeabd9817645
        path: package-source
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install publisher test dependency
      run: python3 -m pip install PyYAML==6.0.2
    - name: Test preservation and fail-closed release guards
      run: python3 -m unittest discover -s tests -p test_publish_preview15.py -v
    - name: Verify exact package then create new prerelease and atomically update catalogs
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -o pipefail

        python3 tools/publish_preview15.py | tee preview15-publication.log'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: VoiceMatrix-build15-publication-evidence
        path: 'preview15-publication.log

          preview15-evidence/*.json

          preview15-evidence/*.sha256'
        if-no-files-found: warn
        retention-days: 14
