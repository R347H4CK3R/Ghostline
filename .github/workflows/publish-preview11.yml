name: Publish inspected unfinished VoiceMatrix build11 preview
'on':
  push:
    branches:
    - publish/voicematrix-build11-preview
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-voicematrix-build11-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'R347H4CK3R/Ghostline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: R347H4CK3R/VoiceMatrix-Development
        ref: 3b976fe84b6f34b2fd7668baf45533e5b7a377a5
        path: package-source
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Test preservation and fail-closed release guards
      run: python3 -m unittest discover -s tests -p test_publish_preview11.py -v
    - name: Verify exact package then create new prerelease and atomically update catalogs
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -o pipefail

        python3 tools/publish_preview11.py | tee preview11-publication.log'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: VoiceMatrix-build11-publication-evidence
        path: 'preview11-publication.log

          preview11-evidence/*.json

          preview11-evidence/*.sha256'
        if-no-files-found: warn
        retention-days: 14
