name: Native RVC feature preparation
on:
  push:
    branches: ['work/native-rvc-feature-preparation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 experiments/RVCFeatureCore/test_features.py
      - name: Native sanitizer checks
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer experiments/RVCFeatureCore/features.cpp experiments/RVCFeatureCore/native.cpp -o "$RUNNER_TEMP/features"
          "$RUNNER_TEMP/features"
      - name: Compile iPhone ARM64 component
        if: runner.os == 'macOS'
        run: xcrun --sdk iphoneos clang++ -std=c++17 -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -Wall -Wextra -Werror -c experiments/RVCFeatureCore/features.cpp -o "$RUNNER_TEMP/features.o"
