name: Stock-free VoiceMatrix update
on:
  push:
    paths: ['.github/workflows/paired-test-ipa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore inspected offline resources
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,zipfile,pathlib,shutil
          url='https://github.com/R347H4CK3R/Ghostline/releases/download/voicematrix-v0.3.0-studio-1/VoiceMatrix-v0.3.0-experimental.ipa'
          urllib.request.urlretrieve(url,'baseline.ipa')
          assert hashlib.sha256(pathlib.Path('baseline.ipa').read_bytes()).hexdigest()=='9d6a48ef402d76162ef04f3f653f151d0413605e97575397cad86027fe5ad951'
          with zipfile.ZipFile('baseline.ipa') as z:
           assert z.testzip() is None
           for entry in z.infolist():
            prefix='Payload/VoiceMatrix.app/'
            if not entry.filename.startswith(prefix):continue
            relative=entry.filename[len(prefix):]
            if not relative.startswith(('Phonon/','OpenVoice/')) or entry.is_dir():continue
            target=pathlib.Path('VoiceMatrix/Resources')/relative
            assert '..' not in target.parts
            target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(entry))
          PY
          python3 tools/remove_stock_library.py VoiceMatrix/Resources > removed-stock-profiles.json
          python3 -m unittest discover -s tests -v
          brew install xcodegen
          xcodegen generate
      - name: Prepare synthetic reference collection
        run: |
          python3 - <<'PY'
          import pathlib,wave
          from tools.voice_pack import export_reference_pack,export_collection_folder
          root=pathlib.Path('folder-check-fixture');root.mkdir()
          with wave.open(str(root/'original.wav'),'wb') as w:
            w.setparams((1,2,24000,0,'NONE','not compressed'));w.writeframes(b'\x00\x10'*24000)
          m=dict(id='original-test',name='Original Test',categories=['Animation','Fantasy'],source='Synthetic test fixture',permission='Original synthetic fixture',referenceText='A test reference.')
          pack=export_reference_pack(root/'original.wav',m,root/'test.vmpack')
          export_collection_folder([pack],root/'Voices')
          PY
      - name: Compile and execute native private-import checks
        run: |
          xcrun swiftc -parse-as-library VoiceMatrix/CharacterFolderStore.swift tests/native/CharacterFolderChecks.swift -o character-folder-checks
          ./character-folder-checks folder-check-fixture/Voices
      - name: Check shared recording and character-speech ownership
        run: |
          xcrun swiftc -parse-as-library VoiceMatrix/StudioActivity.swift tests/native/StudioActivityChecks.swift -o studio-activity-checks
          ./studio-activity-checks
      - name: Compile and inspect complete unsigned test app
        run: |
          xcodebuild -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme VoiceMatrix -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath paired-build CODE_SIGNING_ALLOWED=NO build > paired-build.log 2>&1 || { tail -160 paired-build.log; exit 1; }
          mkdir Payload
          cp -R paired-build/Build/Products/Release-iphoneos/VoiceMatrix.app Payload/
          python3 tools/package_ipa.py Payload VoiceMatrix-0.3.1.ipa
          python3 tools/inspect_ipa.py VoiceMatrix-0.3.1.ipa > paired-inspection.json
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMatrix-0.3.1
          path: |
            VoiceMatrix-0.3.1.ipa
            paired-inspection.json
          if-no-files-found: error
      - name: Publish inspected experimental test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create voicematrix-v0.3.1-no-stock-9 VoiceMatrix-0.3.1.ipa paired-inspection.json removed-stock-profiles.json --prerelease --target "$GITHUB_SHA" --title "VoiceMatrix 0.3.1 — stock profiles removed (build 9)" --notes "All 537 bundled stock profiles and their conversion profile companions are removed. Empty voice library; engine model files retained. No user recordings or personal files are deleted by the update. Synthesis is unavailable until a usable voice is supplied; Automatic laptop pairing, automatic queue submission, and private character-folder import are preserved from main. Imported references still require compatible native synthesis; character inference remains unfinished. Unsigned ARM64 IPA, iOS 26+. Existing installation feeds unchanged."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Paired-test-build-log
          path: paired-build.log
