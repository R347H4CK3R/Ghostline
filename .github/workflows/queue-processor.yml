name: Prepared voice queue processor checks
on:
  push:
    paths: ['tools/companion_runtime.py', 'tests/test_companion_runtime.py', 'tools/video_prepare.py', 'tools/video_reference.py', 'tools/video_download.py', 'tools/process_control.py', 'tools/voice_pack.py', 'tests/test_video_preparation.py', 'tools/queue_processor.py', 'tools/video_queue.py', 'tools/master_voices.py', 'tools/pack_speech.py', 'tests/test_queue_processor.py', 'tests/test_queue_publication.py', '.github/workflows/queue-processor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows media test dependency
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Linux media test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run source, real queue/files, transport and cancellation regressions
        run: python -m unittest discover -s tests -v

