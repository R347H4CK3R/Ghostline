name: Inspect final UI test evidence
on:
  push:
    branches: [maintenance/ui-screenshot-review]
    paths: [.github/workflows/ui-screenshot-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Read actual simulator test summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42519869947 --repo R347H4CK3R/Ghostline --name Current-character-UI-evidence --dir evidence
          python3 - <<'PY'
          import pathlib
          for name in ('character-ui.log','character-workflow.log'):
              print(name)
              for line in (pathlib.Path('evidence')/name).read_text().splitlines():
                  if 'Executed ' in line or ('Test Suite ' in line and 'passed' in line) or ('Test Case ' in line and 'testImportSelect' in line):
                      print(line)
          PY
