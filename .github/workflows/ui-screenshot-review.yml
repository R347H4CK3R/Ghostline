name: Review UI screenshots
on:
  push:
    branches: [maintenance/ui-screenshot-review]
    paths: [.github/workflows/ui-screenshot-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - name: Read synthetic simulator screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42517190096 --repo R347H4CK3R/Ghostline --name Current-character-UI-evidence --dir evidence
          python3 - <<'PY'
          import base64,io,json,pathlib
          from PIL import Image
          paths=list(pathlib.Path('evidence').glob('workflow-screenshots/**/*.png'))+list(pathlib.Path('evidence').glob('ui-screenshots/**/*.png'))
          print("Screenshot count:",len(paths))
          for path in paths[:2]:
              im=Image.open(path).convert('RGB')
              im.thumbnail((390,900))
              data=io.BytesIO();im.save(data,format='JPEG',quality=55)
              print('SCREENSHOT '+json.dumps(dict(file=path.name,data=base64.b64encode(data.getvalue()).decode())))
          PY
