name: Exact VoiceMatrix local MLX mirror link proof
on:
  push:
    branches: [verification/voicematrix-build18-package-trust]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'R347H4CK3R/Ghostline' && github.ref == 'refs/heads/verification/voicematrix-build18-package-trust' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: R347H4CK3R/VoiceMatrix-Development
          ref: 5eeb1ff766dac302f21418bea177a619eeb7c7f4
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Compile and verify only the generic iPhoneOS dependency link probe
        env:
          VM_SOURCE_SHA: 5eeb1ff766dac302f21418bea177a619eeb7c7f4
          VM_SOURCE_TREE: e3ce2f9bd142f9aa51c048694aa8d716664e67a8
        run: |
          set -euo pipefail
          umask 077
          guard() { printf 'product_activation_guard=%s\n' "$1" >&2; exit 1; }
          [[ $VM_SOURCE_SHA =~ ^[a-f0-9]{40}$ && $VM_SOURCE_TREE =~ ^[a-f0-9]{40}$ ]] || guard exact-pins
          [[ "$(git rev-parse HEAD)" == "$VM_SOURCE_SHA" && "$(git rev-parse HEAD^{tree})" == "$VM_SOURCE_TREE" ]] || guard exact-checkout
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] || guard arm64
          python3 -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))' || guard python-3-12
          scratch=$(mktemp -d "${RUNNER_TEMP}/vm-product-tools.XXXXXX") || guard scratch
          trap 'rm -rf -- "$scratch"' EXIT
          curl --fail --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 --max-filesize 30000000 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$scratch/xcodegen.zip" || guard fetch-generator
          [[ "$(shasum -a 256 "$scratch/xcodegen.zip" | awk '{print $1}')" == a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73 ]] || guard generator-archive
          unzip -p "$scratch/xcodegen.zip" 'xcodegen/bin/xcodegen' > "$scratch/xcodegen" || guard generator-extract
          [[ "$(shasum -a 256 "$scratch/xcodegen" | awk '{print $1}')" == a450f63bdd650c280cfce0fef6c94dbb19c5bf8dc32811361fd5d2e912718503 ]] || guard generator-executable
          chmod 0700 "$scratch/xcodegen"
          unset GH_TOKEN GITHUB_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID
          bash probes/physical-audit/product-plan/run_mlx_mirror.sh "$VM_SOURCE_SHA" "$scratch/xcodegen" link-only
