name: VoiceMatrix build18 verify and promote existing draft once
on:
  push:
    branches: [verification/voicematrix-build18-promote]
permissions:
  contents: write
jobs:
  promote:
    if: github.repository == 'R347H4CK3R/Ghostline' && github.ref == 'refs/heads/verification/voicematrix-build18-promote' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Revalidate exact six existing assets, publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          guard() { printf 'product_promote_activation_guard=%s\n' "$1" >&2; exit 1; }
          scratch=$(mktemp -d "$RUNNER_TEMP/vm-promote-proof.XXXXXX") || guard scratch
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s' '' | base64 --decode > "$scratch/promote.sh"
          printf '%s' '' | base64 --decode > "$scratch/promotion.json"
          [[ "$(sha256sum "$scratch/promote.sh" | awk '{print $1}')" == 6544c592e50731c8267c916b28140539be1d1fba72bf717315e9274796d172a1 ]] || guard exact-reviewed-script
          bash "$scratch/promote.sh" "$scratch/promotion.json" 034eb885d9490c7a6439d7e4bac262b8c7e56593aaba919b6c4008276f4d8405
