name: VoiceMatrix build18 verified draft only
on:
  push:
    branches: [verification/voicematrix-build18-draft]
permissions:
  contents: write
jobs:
  native:
    if: github.repository == 'R347H4CK3R/Ghostline' && github.ref == 'refs/heads/verification/voicematrix-build18-draft' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          token: ""
      - name: Build and inspect exact public app in private runner custody
        env:
          VM_SOURCE_SHA: 5c0d71108a751c18a434d7b40e6357ce215d582e
          VM_SOURCE_TREE: c8fb8c0f3939d25cf285ded054d08a8cc923b0ed
          VM_APPROVED_RECEIPT_SHA: e70b9dafbce399f52453ecb9b3c14dd5acff060ce039c2bd4850e3a6c40cdfe4
          VM_NATIVE_RECEIPT_SHA: 8b6b74c85859339039adc695d5eb0e92c8c6e9516dbc0ef9da255ce259c77cce
        run: |
          set -euo pipefail
          umask 077
          guard() { printf 'product_activation_guard=%s\n' "$1" >&2; exit 1; }
          [[ $VM_SOURCE_SHA =~ ^[a-f0-9]{40}$ && $VM_SOURCE_TREE =~ ^[a-f0-9]{40}$ && $VM_APPROVED_RECEIPT_SHA =~ ^[a-f0-9]{64}$ && $VM_NATIVE_RECEIPT_SHA =~ ^[a-f0-9]{64}$ ]] || guard exact-pins
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID GIT_ASKPASS SSH_ASKPASS
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          tag=voicematrix-v0.4.15-build18
          if ! refs=$(/usr/bin/git -c credential.helper= ls-remote --refs https://github.com/R347H4CK3R/Ghostline.git "refs/tags/$tag" 2>/dev/null); then
            guard public-tag-query
          fi
          [[ -z $refs ]] || guard preexisting-tag
          repo="$RUNNER_TEMP/vm-release-source-$GITHUB_RUN_ID"
          mkdir -m 0700 "$repo" || guard owned-source
          (
            cd "$repo"
            /usr/bin/git -c credential.helper= init -q
            /usr/bin/git -c credential.helper= fetch --no-tags --depth=1 https://github.com/R347H4CK3R/VoiceMatrix-Development.git "$VM_SOURCE_SHA"
            /usr/bin/git -c credential.helper= checkout -q --detach FETCH_HEAD
          ) >"$repo/../vm-release-source-$GITHUB_RUN_ID.log" 2>&1 || guard exact-anonymous-checkout
          cd "$repo"
          [[ "$(git rev-parse HEAD)" == "$VM_SOURCE_SHA" && "$(git rev-parse HEAD^{tree})" == "$VM_SOURCE_TREE" ]] || guard exact-checkout
          [[ "$(uname -s)" == Darwin && "$(uname -m)" == arm64 ]] || guard arm64
          python3 -c 'import sys; raise SystemExit(sys.version_info[:2] != (3, 12))' || guard python-3-12
          scratch=$(mktemp -d "${RUNNER_TEMP}/vm-product-tools.XXXXXX") || guard scratch
          trap 'rm -rf -- "$scratch"' EXIT
          # Substitute independently approved bytes, not a fabricated acceptance template.
          printf '%s' '' | /usr/bin/base64 -D > "$scratch/approval.json"
          printf '%s' '' | /usr/bin/base64 -D > "$scratch/native-proof.json"
          python3 probes/physical-audit/product-plan/mlx_product_gate.py "$scratch/native-proof.json" "$VM_NATIVE_RECEIPT_SHA"
          python3 probes/physical-audit/product-plan/preflight.py "$scratch/approval.json" "$VM_APPROVED_RECEIPT_SHA" "$VM_SOURCE_SHA" --require-effective
          curl --fail --silent --location --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 120 --max-filesize 30000000 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip -o "$scratch/xcodegen.zip" || guard fetch-generator
          [[ "$(shasum -a 256 "$scratch/xcodegen.zip" | awk '{print $1}')" == a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73 ]] || guard generator-archive
          python3 probes/physical-audit/product-plan/install_xcodegen.py install "$scratch/xcodegen.zip" "$scratch" || guard generator-exact-install
          generator="$scratch/xcodegen/bin/xcodegen"
          [[ "$(shasum -a 256 "$generator" | awk '{print $1}')" == a450f63bdd650c280cfce0fef6c94dbb19c5bf8dc32811361fd5d2e912718503 ]] || guard generator-executable
          unset GH_TOKEN GITHUB_TOKEN SSH_AUTH_SOCK SSH_AGENT_PID
          printf '%s' '' | /usr/bin/base64 -D > "$scratch/prepare-custody-builder.py"
          [[ "$(shasum -a 256 "$scratch/prepare-custody-builder.py" | awk '{print $1}')" == d30688b418cdf7b85937ed6fedb6adc623f6d218df9b09376e773e62fd8e55b5 ]] || guard local-script-digest
          printf '%s' '' | /usr/bin/base64 -D > "$scratch/host-extract-and-evidence.py"
          [[ "$(shasum -a 256 "$scratch/host-extract-and-evidence.py" | awk '{print $1}')" == 607bbec8558791b9585cdceb8304a00f403d15b8e968103bbadae26e44e27f0e ]] || guard local-script-digest
          custody="$RUNNER_TEMP/vm-release-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$custody" || guard custody-owned
          trap 'r=$?; rm -rf -- "$scratch" "$repo"; rm -f -- "$repo/../vm-release-source-$GITHUB_RUN_ID.log"; if [[ $r != 0 ]]; then rm -rf -- "$custody"; fi; exit "$r"' EXIT
          python3 "$scratch/prepare-custody-builder.py" probes/physical-audit/product-plan/run_mlx_mirror.sh "$scratch/custody-runner.sh"
          VM_RELEASE_CUSTODY="$custody" bash "$scratch/custody-runner.sh" "$VM_SOURCE_SHA" "$generator" product-metadata-only \
            "$scratch/approval.json" "$VM_APPROVED_RECEIPT_SHA" "$scratch/native-proof.json" "$VM_NATIVE_RECEIPT_SHA"
          python3 "$scratch/host-extract-and-evidence.py" "$custody"
      - name: Create draft and verify each uploaded byte without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          guard() { printf 'product_draft_activation_guard=%s\n' "$1" >&2; exit 1; }
          scratch=$(mktemp -d "$RUNNER_TEMP/vm-publisher.XXXXXX") || guard owned-scratch
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s' '' | /usr/bin/base64 -D > "$scratch/upload-verified-draft.sh"
          [[ "$(shasum -a 256 "$scratch/upload-verified-draft.sh" | awk '{print $1}')" == 4281e0c608a59f42085212aca39868e653a65d08fd6c14fd8ac7e54967c31d6c ]] || guard local-script-digest
          bash "$scratch/upload-verified-draft.sh" "$RUNNER_TEMP/vm-release-custody-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
