name: Actual standalone local pipeline diagnostic
on:
  workflow_call:
    inputs:
      use-frozen:
        type: boolean
        default: false
        required: false
  workflow_dispatch:
  push:
    branches-ignore:
      - 'candidate/voicematrix-0.4.9'
    paths:
      - 'probes/native-local-studio/**'
      - 'probes/native-local-studio-fixtures/**'
      - '.github/workflows/local-pipeline-diagnostic.yml'
      - 'VoiceMatrix/Local*.swift'
      - 'VoiceMatrix/CharacterLibrary.swift'
      - 'VoiceMatrix/OnDeviceTranscription.swift'
      - 'VoiceMatrix/F5ReferenceEngine.swift'
      - 'project.yml'
permissions:
  contents: read
jobs:
  actual-local-pipeline:
    strategy:
      fail-fast: false
      matrix:
        fixture: [audio, video]
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.use-frozen }}
        with:
          name: Character-frozen-dependencies
          path: frozen
      - name: Validate source and prepare pinned shared assets
        run: |
          python3 -m unittest tests.test_local_pipeline_diagnostic tests.test_local_video_studio -v
          python3 tools/bundle_asr.py
          python3 tools/bundle_diarization.py
          python3 tools/character_package.py prepare --cache character-cache --resources character-resources > assets.json
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          target=Path('VoiceMatrix/Resources/F5TTS')
          if target.is_symlink(): raise SystemExit('Unexpected link')
          if target.exists(): shutil.rmtree(target)
          shutil.copytree('character-resources/F5TTS',target)
          PY
      - name: Create neutral runtime fixture using installed macOS speech
        run: |
          mkdir -p local-evidence
          python3 - <<'PY'
          import subprocess,re,json,hashlib,platform
          from pathlib import Path
          sandbox=['/usr/bin/sandbox-exec','-p','(version 1)(allow default)(deny network*)']
          voices=subprocess.check_output(sandbox+['/usr/bin/say','-v','?'],text=True)
          choices=[re.match(r'^(.*?)\s+en_US\s+#',line) for line in voices.splitlines()]
          choices=[m.group(1).strip() for m in choices if m]
          if not choices: raise SystemExit('No installed English voice; no download or fallback')
          voice='Samantha' if 'Samantha' in choices else choices[0]
          text='Please open the blue notebook and write down these instructions. First close the window and put the book on the table. Then bring a glass of water to the quiet room. We will check every sentence before saving the recording.'
          path=Path('local-evidence/neutral.wav')
          subprocess.run(sandbox+['/usr/bin/say','-v',voice,'-r','155','--file-format=WAVE','--data-format=LEI16@24000','-o',str(path),text],check=True,timeout=120)
          Path('local-evidence/fixture.json').write_text(json.dumps(dict(text=text,voice=voice,os=platform.platform(),sha256=hashlib.sha256(path.read_bytes()).hexdigest(),kind='macOS installed synthetic neutral voice; no character likeness claim'),indent=2))
          PY
          python3 tools/create_diagnostic_collection.py
      - name: Create original video fixture with real audio track
        if: matrix.fixture == 'video'
        run: |
          xcrun swiftc -target arm64-apple-macos15.0 -swift-version 5 -parse-as-library probes/native-local-studio-fixtures/CreateVideoFixture.swift -o local-evidence/create-video-fixture
          sandbox-exec -p '(version 1)(allow default)(deny network*)' local-evidence/create-video-fixture local-evidence/neutral.wav local-evidence/neutral.mov
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          video=Path('local-evidence/neutral.mov')
          audio=Path('local-evidence/neutral.wav')
          Path('local-evidence/video-fixture.json').write_text(json.dumps(dict(kind='Original synthetic label movie plus installed neutral speech; no character likeness claim',videoSHA256=hashlib.sha256(video.read_bytes()).hexdigest(),audioSHA256=hashlib.sha256(audio.read_bytes()).hexdigest(),expectedVisibleText='VISIBLE LABEL: DEMO'),indent=2))
          PYCODE
      - name: Build exact production coordinator on Apple Silicon
        env:
          USE_FROZEN: ${{ inputs.use-frozen || false }}
        run: |
          test "$(uname -m)" = arm64
          brew install xcodegen
          mkdir -p VoiceMatrix/Resources/{Phonon,OpenVoice,F5TTS}
          xcodegen generate
          graph=VoiceMatrix.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ "$USE_FROZEN" = true ]; then
            mkdir -p "$(dirname "$graph")"
            cp frozen/Package.resolved "$graph"
            xcodebuild -resolvePackageDependencies -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -derivedDataPath local-build > local-evidence/resolve.log 2>&1 || { tail -120 local-evidence/resolve.log; exit 1; }
            cmp frozen/Package.resolved "$graph"
          else
            xcodebuild -resolvePackageDependencies -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -derivedDataPath local-build > local-evidence/resolve.log 2>&1 || { tail -120 local-evidence/resolve.log; exit 1; }
          fi
          cp "$graph" local-evidence/Package.resolved
          xcodebuild -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -project VoiceMatrix.xcodeproj -scheme LocalStudioDiagnostic -configuration Release -derivedDataPath local-build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > local-evidence/build.log 2>&1 || { tail -120 local-evidence/build.log; exit 1; }
          cmp local-evidence/Package.resolved "$graph"
          python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          raw=Path('local-evidence/Package.resolved').read_bytes()
          frozen=os.environ['USE_FROZEN']=='true'
          if frozen and raw!=Path('frozen/Package.resolved').read_bytes(): raise SystemExit('Frozen dependency graph changed')
          Path('local-evidence/dependency-evidence.json').write_text(json.dumps(dict(sourceCommit=os.environ['GITHUB_SHA'],dependencyGraphSHA256=hashlib.sha256(raw).hexdigest(),dependencyMode='candidate-shared-frozen-graph' if frozen else 'independently-resolved',frozenGraphVerified=frozen),indent=2))
          PYCODE
      - name: Require actual retained-source pipeline with networking denied
        env:
          FIXTURE_KIND: ${{ matrix.fixture }}
        run: |
          fixture=local-evidence/neutral.wav
          if [ "$FIXTURE_KIND" = video ]; then fixture=local-evidence/neutral.mov; fi
          sandbox-exec -p '(version 1)(allow default)(deny network*)' local-build/Build/Products/Release/LocalStudioDiagnostic VoiceMatrix/Resources "$fixture" tests/fixtures/DiagnosticVoices local-evidence/isolated-work local-evidence/pipeline-evidence.json "$GITHUB_SHA" "$FIXTURE_KIND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.fixture == 'audio' && 'Actual-local-pipeline-evidence' || 'Actual-local-video-pipeline-evidence' }}
          path: local-evidence
          if-no-files-found: error
          retention-days: 14
