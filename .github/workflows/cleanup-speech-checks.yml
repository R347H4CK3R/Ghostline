name: Retire superseded speech checks
on:
  push:
    branches: ['feature/voicematrix-speech-controls']
    paths: ['.github/workflows/cleanup-speech-checks.yml']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only older checks for this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo='R347H4CK3R/Ghostline'
          endpoint=f'repos/{repo}/actions/runs?branch=feature/voicematrix-speech-controls&per_page=100'
          runs=json.loads(subprocess.check_output(['gh','api',endpoint]))['workflow_runs']
          for run in runs:
              if run['head_sha']!=os.environ['CURRENT_SHA'] and run['status'] in ('queued','in_progress') and run['name'] in ('Native app compile checks','Current no-stock character UI smoke'):
                  subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{run["id"]}/cancel'],check=True)
                  print('Cancelled superseded feature check',run['id'])
          PY
