name: Retire superseded candidate check
on:
  push:
    branches: ['feature/voicematrix-speech-controls']
    paths: ['.github/workflows/cleanup-speech-checks.yml']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded candidate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          endpoint='repos/R347H4CK3R/Ghostline/actions/runs/42555960979'
          run=json.loads(subprocess.check_output(['gh','api',endpoint]))
          assert run['head_sha']=='000c1330774cb4fd5c7fd2e44de7fc37520c4618'
          assert run['name']=='VoiceMatrix 0.4.5 candidate gates'
          if run['status'] in ('queued','in_progress'):
              subprocess.run(['gh','api','--method','POST',endpoint+'/cancel'],check=True)
          PY
