name: Rick and Morty experimental audio only
on:
  push:
    branches: ['prototype/voicematrix-rick-morty-*']
permissions:
  contents: read
  actions: read
jobs:
  experimental-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RVC_SOURCE_REVISION: 81eed5e8f68b6bed1789f682fe78cdd324495afc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only development tools
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' scipy soundfile 'transformers==4.57.1' librosa praat-parselmouth faiss-cpu
          git clone https://github.com/RVC-Project/Retrieval-based-Voice-Conversion-WebUI.git experimental-rvc
          git -C experimental-rvc checkout "$RVC_SOURCE_REVISION"
      - name: Use previously verified generated English test audio
        run: |
          gh release download voicematrix-v0.3.0-studio-1 --repo "$GITHUB_REPOSITORY" --pattern VoiceMatrix-0.3.0-native-QA-audio.zip --dir work
      - name: Generate two-identity neural conversion experiment
        run: python tools/prototype_rick_morty.py --rvc experimental-rvc --source-zip work/VoiceMatrix-0.3.0-native-QA-audio.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rick-Morty-AI-imitation-experiment
          path: |
            prototype-audio
            prototype-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print measured functionality report
        if: always()
        run: test ! -f prototype-report.json || cat prototype-report.json
