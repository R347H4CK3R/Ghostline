name: GHOSTLINE iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ghostline-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3 toolchain
        run: xcodebuild -version
      - name: Validate catalog counts and project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('Ghostline/App.swift').read_text()
          assert all(k in a for k in ['@main struct GhostlineApp','AVAudioRecorder','GhostlineLibraryView','RVCPackLibraryView','CloneStudioView'])
          print('Source checks passed')
          PY
      - name: Enforce verified authentic voice inventory
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest=json.loads(Path("Ghostline/Resources/verified-authentic-voices.json").read_text())
          assert manifest["schema_version"] == 1
          voices=manifest["verified_authentic_voices"]
          assert isinstance(voices, list)
          required={"identity_attribution_source","voice_usage_authorization","local_model_sha256","on_device_ios_audio_sha256","offline_airplane_mode_confirmed","audible_playback_confirmed","perceptual_identity_review"}
          assert required.issubset(set(manifest["required_evidence"]))
          for voice in voices:
              assert all(voice.get(k) for k in required)
              assert voice["offline_airplane_mode_confirmed"] is True
              assert voice["audible_playback_confirmed"] is True
              assert voice["perceptual_identity_review"] is True
              assert re.fullmatch(r"[0-9a-fA-F]{64}", voice["local_model_sha256"])
              assert re.fullmatch(r"[0-9a-fA-F]{64}", voice["on_device_ios_audio_sha256"])
          # The UI must not promise more authentic identities than documented.
          source=Path("Ghostline/App.swift").read_text()
          assert f'Authentic identities: {len(voices)} verified' in source
          print(f"Verified authentic offline identities: {len(voices)}")
          PY
      - name: Guard identity voice playback and approved tab interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path("Ghostline/App.swift").read_text()
          assert 'func speakLocal()' in a
          fallback=a.split('func speakLocal()',1)[1].split('func previewSystemVoice()',1)[0]
          assert 'synthesizer.speak(' not in fallback, "Never fake identity speech with system TTS"
          assert 'func previewSystemVoice()' in a
          assert 'store.previewSystemVoice()' in a
          assert 'GhostlineTabbedRoot' in a
          assert all('TabView' in a for _ in range(1))
          assert 'GhostlineRVCWebScreen()' in a
          print("Identity fallback guard and five-tab launch checks passed")
          PY
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Prepare Piper's upstream source submodule
        run: |
          set -e
          xcodebuild -resolvePackageDependencies -project GHOSTLINE.xcodeproj -scheme GHOSTLINE -clonedSourcePackagesDirPath build/SourcePackages -derivedDataPath build > package-resolve.log 2>&1 || true
          package_dir="build/SourcePackages/checkouts/piper1-gpl-spm"
          if [ -d "$package_dir/.git" ] || [ -f "$package_dir/.git" ]; then
            git -C "$package_dir" submodule update --init --recursive --depth 1
            test -f "$package_dir/piper1-gpl/libpiper/src/piper.cpp"
          else
            echo "Piper package not present in resolved dependencies"
            cat package-resolve.log
            exit 1
          fi
      - name: Verify Piper candidate manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("Ghostline/Resources/piper-candidates.json")
          x=json.loads(p.read_text())
          assert x["speaker_candidate_count"] >= 500
          assert x["speaker_candidate_count"] == len(x["candidates"])
          assert x.get("speaker_ids_truncated") is False, "No per-model candidate cap is permitted"
          assert "max_speakers_per_model" not in x
          assert all(m["candidate_speakers"] == m["declared_speakers"] for m in x["models"])
          assert sum(m["declared_speakers"] for m in x["models"]) == len(x["candidates"])
          assert all(v["availability"] == "candidate_unverified" for v in x["candidates"])
          ids={v["id"] for v in x["candidates"]}
          assert len(ids)==len(x["candidates"])
          print("Piper candidate slots:",len(ids), "(none counted as device-verified)")
          PY
      - name: Guard Piper model-bound device evidence and cached pack staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Ghostline/PiperVoiceLab.swift').read_text()
          required=[
              'piper.voice.lab.decodedPCM.v3',
              'checkpoint.modelSHA256 == fingerprints.0',
              'checkpoint.configSHA256 == fingerprints.1',
              'validatePack(at: staging)',
              'fm.moveItem(at: staging, to: modelDir)',
              'fm.moveItem(at: backup, to: modelDir)',
              '"model_sha256": modelSHA256',
              '"config_sha256": configSHA256',
              '"airplane_mode_confirmed": false',
              '"distinct_voice_listening_confirmed": false'
          ]
          assert all(item in s for item in required), 'Piper cache/evidence guard missing'
          assert s.index('validatePack(at: staging)') < s.index('fm.moveItem(at: staging, to: modelDir)')
          assert 'piper.voice.lab.decodedPCM.v2"' not in s, 'Do not reintroduce legacy unbound checkpoints'
          print('Piper cached model fingerprints, staging and unverified evidence contracts present')
          PY
      - name: Exercise WAV integrity inspector with deterministic PCM fixtures
        run: |
          swiftc Ghostline/RVCWAVInspector.swift scripts/test_rvc_wav_inspector.swift -o /tmp/ghostline-rvc-wav-tests
          /tmp/ghostline-rvc-wav-tests
          python3 - <<'PY'
          from pathlib import Path
          src=Path('Ghostline/RVCWAVInspector.swift').read_text()
          assert all(x in src for x in ('import CryptoKit','pcmSHA256','NaN or infinite','zero-valued audio samples'))
          print("RVC PCM fingerprint and float-safety guard passed")
          PY
      - name: Test fragmented localhost requests and offline WebKit CSP
        run: |
          swiftc Ghostline/GhostlineHTTPHeaderBuffer.swift scripts/test_rvc_http_header_buffer.swift -o /tmp/ghostline-http-tests
          /tmp/ghostline-http-tests
          python3 - <<'PY'
          from pathlib import Path
          src = Path("Ghostline/OfflineRVCWeb.swift").read_text()
          assert "receiveRequest(connection, buffer: GhostlineHTTPHeaderBuffer())" in src
          assert "switch next.append(chunk, streamEnded: complete)" in src
          assert "Content-Security-Policy: \\(csp)" in src
          assert "let csp = GhostlineRVCNetworkPolicy.contentSecurityPolicy" in src
          assert "Referrer-Policy: no-referrer" in src
          assert ".ipv4(.loopback)" in src
          print("Offline RVC localhost header framing/CSP wiring source guard passed")
          PY
      - name: Guard target-device RVC playback evidence semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('Ghostline/OfflineRVCWeb.swift').read_text()
          mandatory=[
              'func playSavedWAV()', 'AVAudioPlayer(contentsOf: file)',
              'guard replay.duration > 0.2, replay.prepareToPlay(), replay.play()',
              'func attestListening()', 'guard playbackStarted, playbackCompleted, latestWAV != nil, !userAttestedListening',
              '"device_audio_playback_started": false', '"user_attested_listening": false',
              '"device_audio_playback_started": playbackStarted',
              '"device_audio_playback_completed": playbackCompleted',
              '"user_attested_listening": userAttestedListening',
              '"pcm_audio_payload_sha256": info.pcmSHA256',
              '"airplane_mode_confirmed": false',
              '"voice_identity_verified": false',
              '"voice_rights_independently_verified": false',
          ]
          assert all(token in src for token in mandatory), 'RVC listening evidence safety contract changed'
          assert src.index('playbackStarted = false', src.index('func receiveAudio')) < src.index('savedWAV = [', src.index('func receiveAudio'))
          assert src.index('userAttestedListening = false', src.index('func receiveAudio')) < src.index('savedWAV = [', src.index('func receiveAudio'))
          print('RVC in-app replay/attestation implementation present; no false verification flags')
          PY
      - name: Guard native RVC playback completion evidence
        run: python3 scripts/test_rvc_playback_evidence.py
      - name: Guard private RVC candidate-to-converter bridge
        run: python3 scripts/test_private_rvc_pack_bridge.py
      - name: Guard PocketTTS and Kokoro audio-evidence contracts
        run: python3 scripts/test_neural_audio_evidence.py
      - name: Prepare fully offline RVC WebAssembly runtime
        run: |
          python3 scripts/build_offline_rvc_web.py
          test -f build/rvc-web-dist/index.html
          test -f build/rvc-web-dist/inference.worker.js
          test -n "$(find build/rvc-web-dist/onnx-wasm -name '*.wasm' -print -quit)"
      - name: Audit RVC WebAssembly asset integrity and local entrypoint
        run: python3 scripts/audit_offline_rvc_bundle.py build/rvc-web-dist --write
      - name: Build arm64 iOS app
        run: |
          set -o pipefail
          xcodebuild -project GHOSTLINE.xcodeproj -scheme GHOSTLINE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          mkdir -p build/Build/Products/Release-iphoneos/GHOSTLINE.app/RVCWeb
          cp -R build/rvc-web-dist/. build/Build/Products/Release-iphoneos/GHOSTLINE.app/RVCWeb/
          python3 scripts/audit_offline_rvc_bundle.py build/Build/Products/Release-iphoneos/GHOSTLINE.app/RVCWeb --verify
          cp -R build/Build/Products/Release-iphoneos/GHOSTLINE.app Payload/
          /usr/bin/zip -qry GHOSTLINE-unsigned.ipa Payload
          unzip -t GHOSTLINE-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTLINE-unsigned-IPA
          path: GHOSTLINE-unsigned.ipa
      - name: Save build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTLINE-build-logs
          path: xcodebuild.log
