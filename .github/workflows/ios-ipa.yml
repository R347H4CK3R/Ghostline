name: GHOSTLINE iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: ghostline-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3 toolchain
        run: xcodebuild -version
      - name: Validate catalog counts and project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('Ghostline/App.swift').read_text()
          assert all(k in a for k in ['@main struct GhostlineApp','ModelBinding','AVAudioRecorder','Generate AI'])
          print('Source checks passed')
          PY
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Prepare Piper's upstream source submodule
        run: |
          set -e
          xcodebuild -resolvePackageDependencies -project GHOSTLINE.xcodeproj -scheme GHOSTLINE -clonedSourcePackagesDirPath build/SourcePackages -derivedDataPath build > package-resolve.log 2>&1 || true
          package_dir="build/SourcePackages/checkouts/piper1-gpl-spm"
          if [ -d "$package_dir/.git" ] || [ -f "$package_dir/.git" ]; then
            git -C "$package_dir" submodule update --init --recursive --depth 1
            test -f "$package_dir/piper1-gpl/libpiper/src/piper.cpp"
          else
            echo "Piper package not present in resolved dependencies"
            cat package-resolve.log
            exit 1
          fi
      - name: Regenerate pinned Piper candidate metadata
        run: python3 scripts/generate_piper_candidates.py
      - name: Verify Piper candidate manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("Ghostline/Resources/piper-candidates.json")
          x=json.loads(p.read_text())
          assert x["speaker_candidate_count"] >= 500
          assert x["speaker_candidate_count"] == len(x["candidates"])
          assert all(v["availability"] == "candidate_unverified" for v in x["candidates"])
          ids={v["id"] for v in x["candidates"]}
          assert len(ids)==len(x["candidates"])
          assert x["model_count"] == len(x["models"])
          model_ids={m["model_id"] for m in x["models"]}
          assert len(model_ids)==len(x["models"])
          for candidate in x["candidates"]:
              assert candidate["model_id"] in model_ids
              assert candidate["speaker_id"] >= 0
              source_model=next(m for m in x["models"] if m["model_id"] == candidate["model_id"])
              assert candidate["speaker_id"] < source_model["declared_speakers"]
          featured=next(m for m in x["models"] if m["model_id"] == "en_US-libritts_r-medium")
          assert featured["declared_speakers"] >= 500, "500 test IDs exceed model's declared speakers"
          assert all(len(featured[field])==32 for field in ["model_md5","config_md5"])
          print("Piper candidate slots:",len(ids), "(none counted as device-verified)")
          print("Featured model declared speaker IDs:",featured["declared_speakers"])
          PY
      - name: Build arm64 iOS app
        run: |
          set -o pipefail
          xcodebuild -project GHOSTLINE.xcodeproj -scheme GHOSTLINE -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcodebuild.log
      - name: Assemble unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GHOSTLINE.app Payload/
          /usr/bin/zip -qry GHOSTLINE-unsigned.ipa Payload
          unzip -t GHOSTLINE-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTLINE-unsigned-IPA
          path: GHOSTLINE-unsigned.ipa
      - name: Save build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GHOSTLINE-build-logs
          path: xcodebuild.log
