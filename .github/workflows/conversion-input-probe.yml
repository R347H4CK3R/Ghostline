name: Conversion input duration diagnosis
on:
  push:
    paths: ['.github/workflows/conversion-input-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce exact source and reference generation with input measurements
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          say -r 150 -o source.aiff "I found a strange device near the portal."
          say -r 145 -o reference.aiff "This is another clear reference recording. We are testing local voice conversion."
          ffmpeg -v error -i source.aiff -ac 1 -ar 24000 diagnostic-source.wav
          ffmpeg -v error -i reference.aiff -ac 1 -ar 24000 diagnostic-reference.wav
          xcrun swiftc -parse-as-library VoiceMatrix/ConversionAudio.swift probes/native-conversion/Inputs.swift -o conversion-input-check
          ./conversion-input-check diagnostic-source.wav diagnostic-reference.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Conversion-diagnostic-inputs
          path: |
            diagnostic-source.wav
            diagnostic-reference.wav
          if-no-files-found: error
