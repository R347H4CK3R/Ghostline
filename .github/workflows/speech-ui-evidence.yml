name: Inspect speech UI evidence
on:
  push:
    branches: ['feature/voicematrix-speech-controls']
    paths: ['.github/workflows/speech-ui-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Current-character-UI-evidence
          run-id: 42555788090
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect test evidence and suggestion screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import pathlib,subprocess,base64
          root=pathlib.Path('evidence')
          log=(root/'character-ui.log').read_text()
          for line in log.splitlines():
              if 'Test Case ' in line and ('passed' in line or 'failed' in line) or 'Executed ' in line:print(line)
          video=next(root.rglob('E005DD06-7829-4B77-955C-6B46047CD3D2.mp4'))
          for second in (20,28,30):
              out=pathlib.Path(f'suggestion-{second}.jpg')
              subprocess.run(['ffmpeg','-v','error','-ss',str(second),'-i',str(video),'-frames:v','1','-vf','scale=440:-1','-q:v','4',str(out)],check=True)
              print('IMAGE_START_'+str(second))
              print(base64.b64encode(out.read_bytes()).decode())
              print('IMAGE_END')
          PY
