name: Publish verified VoiceMatrix 0.4.7
'on':
  push:
    branches: ['release/voicematrix-0.4.7']
    paths: ['.github/workflows/voicematrix-047-release.yml']
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: voicematrix-047-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install audio test dependency
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg
    - name: Check publisher syntax and source regressions
      run: |
        python3 -m py_compile tools/publish_voicematrix_047.py
        python3 -m unittest discover -s tests -v
    - name: Require finished exact-source gates before downloading artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -c 'from tools.publish_voicematrix_047 import wait_for_gates; wait_for_gates()'
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 43126844268
        name: Character-test-IPA
        path: release-evidence/ipa
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 43126844268
        name: Character-speech-evidence
        path: release-evidence/speech
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 43126844268
        name: Character-conversion-evidence
        path: release-evidence/conversion
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 43126844268
        name: VoiceMatrix-0.4.7-candidate-verification
        path: release-evidence/candidate
    - name: Verify candidate, publish, redownload and update sources
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 -m tools.publish_voicematrix_047
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: VoiceMatrix-0.4.7-publication-report
        path: release-evidence/publication-report.json
        if-no-files-found: warn
